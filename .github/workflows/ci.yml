name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: 安装资源导出工具
        run: pnpm --dir app install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Rust 与用量模型测试
        run: |
          cargo test --manifest-path app/src-tauri/Cargo.toml --lib
          node --test app/tests/*.test.js

      - name: Mosaico 设备核心与真实串口集成
        run: |
          sh firmware/mosaico/tests/run.sh
          cargo build --manifest-path app/src-tauri/Cargo.toml --example mosaico_probe
          python3 scripts/mosaico-simulator.py
          python3 -m unittest discover -s scripts/tests -p 'test_mosaico_memory_report.py'

      - name: JS/Shell 语法检查
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find app/ui hooks scripts \( -name '*.js' -o -name '*.mjs' \) -print0)
          while IFS= read -r -d '' f; do
            bash -n "$f" || fail=1
          done < <(find . hooks scripts statusline -maxdepth 1 -name '*.sh' -print0)
          exit $fail
