<div id="mosaico-layout-options">
  <style>
    #mosaico-layout-options .variant-stage { padding: 24px 0; }
    #mosaico-layout-options .surface {
      width: min(100%, 480px); aspect-ratio: 1; margin: auto; padding: 14px;
      border: 4px solid #363b43; border-radius: 22px; box-sizing: border-box;
      background: #1c1e22; color: #f5f6f8; container-type: inline-size;
      font-family: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
      font-variant-numeric: tabular-nums;
    }
    #mosaico-layout-options .screen { height: 100%; display: grid; grid-template-rows: 24px 76px minmax(0, 1fr); gap: 8px; }
    #mosaico-layout-options .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: clamp(12px, 3.3cqw, 15px); color: #b9c0c9; }
    #mosaico-layout-options .brand { color: #f5f6f8; letter-spacing: .04em; }
    #mosaico-layout-options .brand::before { content: ""; display: inline-block; width: 7px; height: 7px; background: #52c41a; margin-right: 8px; }
    #mosaico-layout-options .usage { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #3b4047; padding-bottom: 8px; min-width: 0; }
    #mosaico-layout-options .ring { flex: 0 0 64px; width: 64px; height: 64px; position: relative; }
    #mosaico-layout-options .ring canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #mosaico-layout-options .ring-number { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; }
    #mosaico-layout-options .usage-text { min-width: 0; flex: 1; }
    #mosaico-layout-options .usage-label { color: #c9d1db; font-size: clamp(13px, 3.4cqw, 16px); margin-bottom: 3px; }
    #mosaico-layout-options .usage-values { display: flex; justify-content: space-between; gap: 10px; font-size: clamp(16px, 4.8cqw, 22px); white-space: nowrap; }
    #mosaico-layout-options .reset { font-size: clamp(11px, 2.9cqw, 13px); color: #aeb6c1; margin-top: 3px; white-space: nowrap; }
    #mosaico-layout-options .main { min-width: 0; min-height: 0; }
    #mosaico-layout-options .hybrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #mosaico-layout-options .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 0; }
    #mosaico-layout-options .hero-state { font-size: clamp(17px, 5.9cqw, 27px); line-height: 1.2; white-space: nowrap; }
    #mosaico-layout-options .hero-art { display: flex; align-items: center; justify-content: center; min-height: 0; height: 42cqw; max-height: 186px; width: 100%; }
    #mosaico-layout-options .hero-art canvas { height: 100%; width: auto; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
    #mosaico-layout-options .hero-name { font-size: clamp(19px, 6.2cqw, 29px); line-height: 1.15; max-width: 100%; white-space: nowrap; }
    #mosaico-layout-options .hero-source { color: #aeb6c1; font-size: clamp(12px, 3.4cqw, 16px); line-height: 1.2; }
    #mosaico-layout-options .overview { display: grid; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 4px; min-width: 0; min-height: 0; }
    #mosaico-layout-options .overview-row { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-left: 9px; border-left: 2px solid #414751; min-width: 0; }
    #mosaico-layout-options .overview-row.current { background: #ffffff08; border-left-color: #c9ced6; }
    #mosaico-layout-options .overview-name { font-size: clamp(14px, 4.4cqw, 20px); white-space: nowrap; line-height: 1.2; }
    #mosaico-layout-options .overview-state { font-size: clamp(12px, 3.6cqw, 17px); line-height: 1.2; white-space: nowrap; }
    #mosaico-layout-options [data-state="awaiting"] { --status: #ff8587; }
    #mosaico-layout-options [data-state="aborted"] { --status: #ffb1a5; }
    #mosaico-layout-options [data-state="your_turn"] { --status: #83b8ff; }
    #mosaico-layout-options [data-state="running"] { --status: #ffd775; }
    #mosaico-layout-options [data-state="idle"] { --status: #bec5ce; }
    #mosaico-layout-options .hero-state, #mosaico-layout-options .overview-state, #mosaico-layout-options .row-state { color: var(--status); }
    #mosaico-layout-options .solo { display: grid; grid-template-rows: minmax(0, 1fr) 22px; gap: 6px; }
    #mosaico-layout-options .solo .hero { gap: 5px; }
    #mosaico-layout-options .solo .hero-art { height: auto; max-height: none; flex: 1; width: 100%; }
    #mosaico-layout-options .solo .hero-art canvas { max-height: 218px; }
    #mosaico-layout-options .solo .hero-name { font-size: clamp(23px, 7.2cqw, 34px); }
    #mosaico-layout-options .solo .hero-state { font-size: clamp(20px, 6.2cqw, 29px); }
    #mosaico-layout-options .solo-footer { display: flex; justify-content: center; gap: 12px; align-items: center; color: #b9c0c9; font-size: clamp(11px, 3.1cqw, 14px); white-space: nowrap; }
    #mosaico-layout-options .session-list { display: grid; grid-template-rows: repeat(5, minmax(0, 1fr)); min-height: 0; }
    #mosaico-layout-options .session-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 104px; gap: 10px; align-items: center; border-bottom: 1px solid #343a43; min-height: 0; }
    #mosaico-layout-options .session-row:last-child { border-bottom: none; }
    #mosaico-layout-options .row-art { height: 50px; display: flex; align-items: center; justify-content: center; }
    #mosaico-layout-options .row-art canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; object-fit: contain; }
    #mosaico-layout-options .row-name { font-size: clamp(18px, 5.6cqw, 26px); white-space: nowrap; line-height: 1.15; }
    #mosaico-layout-options .row-source { font-size: clamp(11px, 3cqw, 14px); color: #aeb6c1; margin-top: 2px; line-height: 1.2; }
    #mosaico-layout-options .row-state { font-size: clamp(14px, 4.8cqw, 22px); text-align: right; white-space: nowrap; }
    #mosaico-layout-options [hidden] { display: none !important; }
    @media (max-width: 420px) {
      #mosaico-layout-options .variant-stage { padding-top: 50px; }
      #mosaico-layout-options .surface { padding: 10px; }
      #mosaico-layout-options .screen { grid-template-rows: 20px 64px minmax(0, 1fr); gap: 6px; }
      #mosaico-layout-options .ring { width: 52px; height: 52px; flex-basis: 52px; }
      #mosaico-layout-options .ring-number { font-size: 11px; }
      #mosaico-layout-options .usage { gap: 8px; padding-bottom: 6px; }
      #mosaico-layout-options .hero { gap: 4px; }
      #mosaico-layout-options .hero-art { height: 36cqw; }
      #mosaico-layout-options .hybrid { gap: 7px; }
      #mosaico-layout-options .overview { gap: 2px; }
      #mosaico-layout-options .overview-row { gap: 2px; padding-left: 6px; }
      #mosaico-layout-options .session-row { grid-template-columns: 34px minmax(0, 1fr) 65px; gap: 7px; }
      #mosaico-layout-options .row-art { height: 32px; }
      #mosaico-layout-options .solo { grid-template-rows: minmax(0, 1fr) 18px; gap: 3px; }
      #mosaico-layout-options .solo .hero { gap: 3px; }
    }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="mosaico 三种可读性布局候选" data-previous-label="上一个方案" data-next-label="下一个方案">
    <section data-variant="主角＋总览" aria-label="推荐方案：一只大宠物加全部会话状态总览">
      <div class="variant-stage"><div class="surface" data-mode="hybrid" aria-label="主角加总览布局"></div></div>
    </section>
    <section data-variant="单宠轮播" aria-label="单只大宠物自动轮播方案" hidden>
      <div class="variant-stage"><div class="surface" data-mode="solo" aria-label="单宠轮播布局"></div></div>
    </section>
    <section data-variant="会话列表" aria-label="五行会话列表方案" hidden>
      <div class="variant-stage"><div class="surface" data-mode="list" aria-label="会话列表布局"></div></div>
    </section>
  </div>
