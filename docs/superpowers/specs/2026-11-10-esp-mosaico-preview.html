<div id="mosaico-passive-preview" class="viz-dotted-background" aria-label="mosaico 被动显示布局草图，示意数据">
  <style>
    #mosaico-passive-preview { padding: 24px 0; }
    #mosaico-passive-preview .device {
      width: min(100%, 480px); aspect-ratio: 1; margin: 0 auto;
      box-sizing: border-box; padding: 14px; border: 5px solid #363b43;
      border-radius: 22px; background: #1c1e22; color: #f5f6f8;
      font-family: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
      container-type: inline-size; overflow: hidden; position: relative;
      box-shadow: 0 8px 22px #0002;
    }
    #mosaico-passive-preview .content { height: 100%; display: grid; grid-template-rows: 24px 102px 1fr; }
    #mosaico-passive-preview .top { display: flex; justify-content: space-between; align-items: start; font-size: clamp(12px, 3.2cqw, 15px); color: #b9c0c9; }
    #mosaico-passive-preview .brand { color: #f5f6f8; letter-spacing: 0.04em; }
    #mosaico-passive-preview .brand::before { content: ""; display: inline-block; width: 7px; height: 7px; background: #52c41a; margin-right: 8px; }
    #mosaico-passive-preview .usage { display: flex; gap: 14px; align-items: center; padding: 2px 0 10px; border-bottom: 1px solid #383c43; min-width: 0; }
    #mosaico-passive-preview .disc { width: 86px; height: 86px; flex: 0 0 86px; position: relative; }
    #mosaico-passive-preview .disc canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    #mosaico-passive-preview .primary-number { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 500; }
    #mosaico-passive-preview .usage-info { flex: 1; min-width: 0; }
    #mosaico-passive-preview .usage-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 5px; }
    #mosaico-passive-preview .source { font-size: clamp(14px, 4.3cqw, 20px); font-weight: 500; }
    #mosaico-passive-preview .position { color: #aeb6c1; font-size: 12px; white-space: nowrap; }
    #mosaico-passive-preview .window-row { display: grid; grid-template-columns: 35px 45px 1fr; gap: 5px; align-items: baseline; font-size: clamp(12px, 3.5cqw, 16px); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
    #mosaico-passive-preview .reset { color: #c2c9d2; text-align: right; white-space: nowrap; font-size: clamp(11px, 2.9cqw, 14px); }
    #mosaico-passive-preview .updated { font-size: 11px; color: #9fa8b4; padding-top: 2px; }
    #mosaico-passive-preview .pets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 3px 7px; padding-top: 9px; min-height: 0; }
    #mosaico-passive-preview .pet { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; gap: 3px; }
    #mosaico-passive-preview .pet[hidden], #mosaico-passive-preview [hidden] { display: none !important; }
    #mosaico-passive-preview .state { white-space: nowrap; font-size: clamp(12px, 3.6cqw, 17px); line-height: 1.25; }
    #mosaico-passive-preview .sprite-stage { height: 78px; width: 100%; display: flex; align-items: end; justify-content: center; }
    #mosaico-passive-preview .sprite { image-rendering: pixelated; max-width: 100%; object-fit: contain; }
    #mosaico-passive-preview .name { font-size: clamp(13px, 4.2cqw, 20px); line-height: 1.3; max-width: 100%; white-space: nowrap; overflow: hidden; }
    #mosaico-passive-preview .origin { font-size: clamp(11px, 2.9cqw, 14px); color: #aeb6c1; line-height: 1.15; }
    #mosaico-passive-preview .pet[data-state="awaiting"] .state { color: #ff8587; }
    #mosaico-passive-preview .pet[data-state="running"] .state { color: #ffd775; }
    #mosaico-passive-preview .pet[data-state="your_turn"] .state { color: #83b8ff; }
    #mosaico-passive-preview .pet[data-state="completed"] .state { color: #82d85b; }
    #mosaico-passive-preview .pet[data-state="awaiting"] .sprite { animation: mosaico-jump 0.9s steps(3) infinite; }
    #mosaico-passive-preview .pet[data-state="running"] .sprite { animation: mosaico-type 0.45s steps(2) infinite; }
    #mosaico-passive-preview .pet[data-state="your_turn"] .sprite { animation: mosaico-peek 1.6s ease-in-out infinite; }
    #mosaico-passive-preview .pet[data-state="completed"] .sprite { animation: mosaico-wiggle 1.1s ease-in-out infinite; }
    #mosaico-passive-preview .pet[data-state="idle"] .sprite { animation: mosaico-breathe 3.2s ease-in-out infinite; }
    #mosaico-passive-preview .standby { position: absolute; inset: 48px 20px 20px; display: flex; flex-direction: column; gap: 14px; justify-content: center; align-items: center; color: #d5dbe4; text-align: center; font-size: clamp(16px, 5.5cqw, 24px); }
    #mosaico-passive-preview .standby small { font-size: clamp(12px, 3.5cqw, 16px); color: #aeb6c1; }
    #mosaico-passive-preview .standby-mark { width: 38px; height: 38px; border: 4px solid #4e5662; border-radius: 50%; }
    @keyframes mosaico-jump { 0%,100% {transform:translateY(0)} 45%,60% {transform:translateY(-7px)} }
    @keyframes mosaico-type { 50% {transform:translateY(2px)} }
    @keyframes mosaico-peek { 0%,100% {transform:translateX(-3px)} 50% {transform:translateX(3px)} }
    @keyframes mosaico-wiggle { 0%,100% {transform:rotate(-4deg)} 50% {transform:rotate(4deg)} }
    @keyframes mosaico-breathe { 50% {transform:scale(1.03,.97)} }
    @media (max-width: 420px) {
      #mosaico-passive-preview { padding-top: 50px; }
      #mosaico-passive-preview .device { padding: 10px; border-width: 4px; }
      #mosaico-passive-preview .content { grid-template-rows: 20px 86px 1fr; }
      #mosaico-passive-preview .disc { width: 65px; height: 65px; flex-basis: 65px; }
      #mosaico-passive-preview .primary-number { font-size: 12px; }
      #mosaico-passive-preview .usage { gap: 8px; }
      #mosaico-passive-preview .window-row { grid-template-columns: 26px 34px 1fr; gap: 3px; }
      #mosaico-passive-preview .pets { padding-top: 5px; gap: 1px 5px; }
      #mosaico-passive-preview .pet { gap: 2px; }
      #mosaico-passive-preview .sprite-stage { height: 36px; }
      #mosaico-passive-preview .updated { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { #mosaico-passive-preview .sprite { animation: none !important; } }
  </style>
  <div class="device" aria-label="mosaico 屏幕，五只宠物同屏，无触摸操作">
    <div class="content">
      <div class="top"><span class="brand">red-green</span><span data-count>5 会话</span></div>
      <div class="usage">
        <div class="disc"><canvas width="90" height="90" aria-label="用量双环表"></canvas><span class="primary-number">43%</span></div>
        <div class="usage-info">
          <div class="usage-heading"><span class="source">Codex</span><span class="position">1 / 2</span></div>
          <div class="window-row"><span>5h</span><span data-value="0">43%</span><span class="reset" data-reset="0">15:30 重置</span></div>
          <div class="window-row"><span>7d</span><span data-value="1">68%</span><span class="reset" data-reset="1">11/15 09:00</span></div>
          <div class="updated">数值更新于 14:20</div>
        </div>
      </div>
      <div class="pets" aria-label="会话宠物"></div>
    </div>
    <div class="standby" hidden><span class="standby-mark" aria-hidden="true"></span><span data-empty-title>等待电脑连接</span><small data-empty-detail>显示与叫声由电脑接续</small></div>
  </div>

      function drawPets() {
        const compact = screen.clientWidth < 400;

          const frame = atlas[item.skin][item.state].frames[0];
