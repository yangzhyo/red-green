<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>red-green pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body data-state="idle">
    <div id="stage">
      <div id="bubble"></div>
      <div id="pet">
        <canvas id="sprite"></canvas>
      </div>
      <div id="tag">…</div>
      <div id="usage" hidden>
        <div class="row" data-window="five_hour">
          <span class="k">5h</span><span class="pct"></span><span class="reset"></span>
        </div>
        <div class="row" data-window="seven_day">
          <span class="k">7d</span><span class="pct"></span><span class="reset"></span>
        </div>
      </div>
    </div>
    <script src="sprites.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
