<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>red-green · 会话阅读</title>
  <link rel="stylesheet" href="/reader.css">
</head>
<body data-page="list">
  <header class="masthead">
    <div class="wordmark"><canvas id="brand-crab" aria-hidden="true"></canvas>red-green</div>
    <span class="section-name">会话阅读</span>
  </header>
  <section class="session-head" aria-labelledby="title">
    <button id="back" aria-label="返回会话列表" hidden><span aria-hidden="true">‹</span><canvas id="back-crab" aria-hidden="true"></canvas><span>列表</span></button>
    <div class="head-line">
      <h1 id="title">桌面伙伴</h1>
      <span id="count" hidden></span>
      <span id="state"></span>
    </div>
    <div id="source" hidden></div>
  </section>
  <p id="status" role="status">正在连接 Mac…</p>
  <form id="pair" hidden>
    <label for="code">输入 Mac 上的六位配对码</label>
    <div class="pair-controls">
      <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <button>配对</button>
    </div>
  </form>
  <main id="view" tabindex="0"><div id="list"></div><div id="messages"></div></main>
  <form id="composer" hidden>
    <label for="reply-text">回复当前 Codex 会话</label>
    <textarea id="reply-text" rows="2" maxlength="8192" required></textarea>
    <div class="reply-actions">
      <span id="reply-info" role="status"></span>
      <button type="button" id="cancel-reply">收起</button>
      <button id="send-reply" type="submit">发送</button>
    </div>
  </form>
  <footer hidden>
    <button id="prev" disabled>上一屏</button>
    <button id="latest" hidden>有新消息 ↓</button>
    <span id="position" title="当前已经载入的正文"></span>
    <button id="open-reply" aria-controls="composer" hidden>回复</button>
    <button id="next" disabled>下一屏</button>
  </footer>
  <script src="/skins.js"></script>
  <script src="/sprites.js"></script>
  <script type="module" src="/reader.js"></script>
</body>
</html>
