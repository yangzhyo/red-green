<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>red-green · 会话</title>
  <link rel="stylesheet" href="/reader.css">
</head>
<body data-page="list">
  <header class="masthead">
    <h1 class="wordmark"><canvas id="brand-crab" aria-hidden="true"></canvas>red-green<small id="history-heading" hidden>历史</small></h1>
    <a class="nav-link" id="history-home" href="#list" hidden>返回首页</a>
  </header>
  <a class="nav-link" id="open-history" href="#history-list" hidden>历史会话</a>
  <form id="composer" hidden>
    <textarea id="reply-text" aria-label="回复当前 Codex 会话" placeholder="输入回复…" rows="2" maxlength="8192" required></textarea>
    <div class="reply-actions">
      <span id="reply-info" role="status"></span>
      <button type="button" id="cancel-reply">收起</button>
      <button id="send-reply" type="submit">发送</button>
    </div>
  </form>
  <section class="session-head" aria-labelledby="title">
    <h1 id="title"></h1>
    <span id="state"></span>
    <div id="source" hidden></div>
  </section>
  <input id="project-filter" type="search" aria-label="按项目名筛选" placeholder="按项目名筛选" hidden>
  <p id="status" role="status">正在连接 Mac…</p>
  <form id="pair" hidden>
    <label for="code">输入 Mac 上的六位配对码</label>
    <div class="pair-controls">
      <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <button>配对</button>
    </div>
  </form>
  <main id="view" tabindex="0">
    <div id="list"></div>
    <section id="history-list" aria-label="Codex 历史会话" hidden>
      <div id="history-rows"></div>
      <button id="history-more" hidden>加载更多</button>
    </section>
    <div id="messages"></div>
  </main>
  <footer hidden>
    <a class="nav-link" id="back" href="#list">返回列表</a>
    <button id="prev" disabled>上一屏</button>
    <button id="latest" hidden>有新消息 ↓</button>
    <span id="position" title="当前已经载入的正文"></span>
    <button id="resume" hidden>继续对话</button>
    <button id="open-reply" aria-controls="composer" hidden>回复</button>
    <button id="next" disabled>下一屏</button>
  </footer>
  <script src="/skins.js"></script>
  <script src="/sprites.js"></script>
  <script type="module" src="/reader.js"></script>
</body>
</html>
